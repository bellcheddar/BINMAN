{# Ternary triangle (spec 6.3): persistent, always visible, and also a control.
   Corners fill as they are pinned, edges light when a real structural link
   exists between the pinned pair, and the centre resolves a degradability
   readout only when all three are pinned. #}
<svg class="triangle" id="ternary" viewBox="0 0 62 56" role="group"
     aria-label="Current selection: glue, ligase and target">
  <title>Selection state</title>
  <desc id="ternary-desc">Nothing pinned yet.</desc>

  <line class="tri-edge" data-edge="glue-ligase" x1="31" y1="8" x2="9" y2="45"/>
  <line class="tri-edge" data-edge="glue-target" x1="31" y1="8" x2="53" y2="45"/>
  <line class="tri-edge" data-edge="ligase-target" x1="9" y1="45" x2="53" y2="45"/>

  <circle class="tri-centre" data-corner="centre" cx="31" cy="33" r="4.5"/>

  <circle class="tri-corner" data-corner="glue" cx="31" cy="8" r="5.5" tabindex="0"
          role="button" aria-label="Glue corner: go to the Glue Atlas"/>
  <circle class="tri-corner" data-corner="ligase" cx="9" cy="45" r="5.5" tabindex="0"
          role="button" aria-label="Ligase corner: go to E3 Triage"/>
  <circle class="tri-corner" data-corner="target" cx="53" cy="45" r="5.5" tabindex="0"
          role="button" aria-label="Target corner: go to Degron Scan"/>

  <text class="tri-label" x="31" y="2.5">GLUE</text>
  <text class="tri-label" x="7" y="53">E3</text>
  <text class="tri-label" x="55" y="53">TGT</text>
</svg>
