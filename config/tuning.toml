# BINMAN derived tuning
# Generated by tools/hwprobe.py at 2026-10-03T16:40:55+00:00
# Do not edit by hand: re-run `pixi run hwprobe` instead.

[compute]
cpu_workers = 14
io_workers = 16
freesasa_workers = 14
dssp_workers = 14
memory_headroom_gb = 24
usable_memory_gb = 104.0
max_compute_hours = 96

[model]
model_device = "mps"
model_instances = 1
mlx_batch_size = 4
mlx_available = true
gate_g1_candidate = false
# The evaluation stage describing the shipped adapter, so Section 9.5 floors
# report the model on the Hub rather than the last evaluation that ran.
shipped_stage = "round07-32layers"

[io]
rcsb_rate_limit_per_sec = 8
afdb_rate_limit_per_sec = 8
generic_rate_limit_per_sec = 4
retry_attempts = 5
retry_backoff_seconds = 2
http_timeout_seconds = 60

[disk]
gate_g5_free_gb_floor = 50
free_gb_at_probe = 1513.7

[env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"
TOKENIZERS_PARALLELISM = "false"
OMP_NUM_THREADS = "14"

