# BINMAN thresholds (spec Section 5).
#
# Every cutoff used anywhere in the pipeline lives here. No Python file in this
# project may contain a scientific threshold as a literal. Values marked
# "starting point only" have no empirical standing and are overwritten by a fit
# (see [degradability.reach_window]).

[bridging]
# spec 5.1: a non-polymer entity bridges chains A and B when all of these hold.
min_dsasa_per_chain_a2       = 25.0   # buried area against each chain, Angstrom^2
# ADJUSTED 2026-10-04 from 3 to 2, authorised by Marc. This is the SECOND
# documented threshold adjustment in the build; spec 9.6 allows one, so this one
# is a deviation taken on an explicit decision rather than on the spec's
# allowance, and it is recorded as such in DECISIONS.md D-064.
#
# WHAT IT COSTS AND WHAT IT BUYS, both measured before the change:
#
#   recall       0.7719 -> 0.8250   (+17 curated entries, floor 0.85)
#   bridges     110,372 -> 122,048  (+10.6% of instances)
#   glue share     12.7% ->  12.9%  (the admitted mix is 14.9% glue, which is
#                                    richer than the existing 12.7%, so this
#                                    does not flood the atlas with furniture)
#   artefact precision   unchanged: it is computed over CCD classifications in
#                        the `ligand` table and does not depend on this floor.
#
# WHY 3 WAS WRONG. The criterion is meant to stop a ligand being called a bridge
# when it merely passes near a second chain. At 3 it was rejecting the opposite
# case: a glue lying flat in a shallow groove, burying a lot of surface through
# few close approaches. In 3SML the ligand buries 628 A^2 against 14-3-3 sigma
# and 145 A^2 against the phosphopeptide, five times the 25 A^2 floor on the
# weaker side, with 2 contacts. In 3P1O fusicoccin buries 965 and 139. Both were
# rejected. dSASA and contact count are not independent checks on that geometry:
# the second was overruling the first on exactly what the module exists to find.
min_heavy_atom_contacts      = 2      # was 3; see the measured note above
contact_cutoff_a             = 4.0    # Angstrom
min_ligand_heavy_atoms       = 10     # ~150 Da, waived for prior glue_candidate CCDs
sasa_probe_radius_a          = 1.4
sasa_algorithm               = "LeeRichards"
default_assembly_id          = "1"
# A balance near 1.0 is the signature of a genuine glue. Near 0 is a ligand
# bound to one chain that happens to graze another.
glue_balance_floor           = 0.30   # below this, reported but not headline
glue_balance_strong          = 0.50   # used by the worked-example selector (6.6.4)

# Work cap per entry. The bridging test is O(ligand instances x polymer chains),
# and the tail of the PDB holds assemblies where that product is enormous: 6NK6
# has 960 chains and 720 ligand instances (691,200 pairs) and took 20 minutes.
# Entries above this cap are recorded as `failed:too_complex:<chains>x<ligands>`
# rather than processed, so they stay visible in the counts and can be re-run by
# raising the cap. This is a compute budget, not a scientific claim: nothing is
# asserted about whether those assemblies contain glues.
#
# For scale, a CRBN-DDB1 neosubstrate ternary is about 5 chains and 3 ligands
# (15 pairs), so the cap is roughly a thousand times larger than the structures
# this project exists to find.
# RAISED 2026-10-04 from 20,000 to 900,000. This is a work cap, not a science
# threshold: it decides which assemblies are attempted, never which bridges
# qualify, so it is not a spec 9.6 adjustment.
#
# The first clean re-run of the stage exposed what 20,000 actually costs.
# 1,043 entries were refused where the shipped run refused 235, and 808 of the
# difference had completed before and held 43,961 bridges: 18.4% of the atlas.
# The cap was introduced partway through the original multi-session run, so
# entries processed before it existed went through and later ones did not. The
# shipped atlas's coverage therefore depended on *when* an entry happened to be
# processed, which is why the old manifest both completed 7SFV at 864,000 pairs
# and refused others at 20,406.
#
# 900,000 is set just above the largest assembly the original run completed, so
# this run recovers every lost bridge and also takes in 216 entries the original
# refused by accident of timing. It costs about 846 minutes of single-threaded
# geometry, an hour across the configured workers. Above 900,000 adds entries
# and no bridges: those are the million-pair assemblies the original refused on
# purpose.
max_chain_ligand_pairs       = 900000

[degron]
# spec 5.2: beta-hairpin with an exposed glycine at the tip.
#
# CALIBRATED 2026-10-03 against the measured geometry of documented CRBN and
# DCAF neosubstrate degrons. This is the single documented threshold adjustment
# spec 9.6 permits, and it is a measurement, not a loosening. The spec 5.2
# values applied literally recover NONE of the canonical zinc-finger degrons.
#
# Measured at the documented degron glycine of each (AlphaFold human models,
# mkdssp 4.6.1):
#
#   gene      Gly   pLDDT  relSASA  strandA  strandB  turn
#   IKZF1     151    71.9     0.34        2        2     6
#   IKZF3     155    86.4     0.15        2        1    -1
#   SALL4     416    85.5     0.44        2        2     6
#   CSNK1A1    40    96.4     0.48        8        8     5
#   RBM39     268    91.1     0.43        0        8     -
#
# The zinc-finger degron is a TWO-residue beta-hairpin with a six-residue turn.
# A 3-residue strand floor and a 5-residue turn ceiling each exclude IKZF1 and
# SALL4 on their own, and the 0.40 relative-SASA floor excludes IKZF1 as well.
#
# NOT INDEPENDENTLY VALIDATED: the spec 9.2 zinc-finger screen datasets did not
# resolve (Gate G7), so there is no matched negative set and the specificity
# cost of these values is unmeasured. See FINDINGS.md.
min_strand_length            = 2      # was 3; IKZF1, IKZF3 and SALL4 all measure 2
max_turn_length              = 6      # was 5; IKZF1 and SALL4 both measure 6
tip_glycine_offsets          = [-1, 0, 1]   # tip or tip +/- 1 must be glycine
min_mean_plddt               = 70.0   # unchanged: every measured degron clears it
# Spec 5.2 asks for "tip-region mean pLDDT" without defining the region width,
# so it is named here rather than left as a literal in the code. A width of 1
# (the tip and its immediate neighbours) is the natural reading of "tip region";
# a width of 2 pulls in residue 149 of IKZF1 at pLDDT 64.0 and drags the mean to
# 69.5, rejecting a textbook degron on 0.5 of a pLDDT point. This is an
# implementation choice the spec left open, not a threshold adjustment.
tip_region_half_width        = 1      # residues either side of the tip
min_tip_rel_sasa             = 0.30   # was 0.40; IKZF1 measures 0.34
# IKZF3 measures 0.15 and is a known miss: its degron glycine is largely buried
# in the monomer model and becomes exposed only in the ternary complex. A floor
# low enough to catch it would fire on most of the proteome, so it is reported
# as a miss rather than accommodated.
calibration_date             = "2026-10-03"
calibration_basis            = "measured geometry of 5 documented CRBN/DCAF neosubstrate degrons"
calibration_validated        = false
# Composite score weights (pLDDT, exposure, hairpin regularity). Transparent by
# design: every component is a visible column in the UI.
weight_plddt                 = 0.35
weight_exposure              = 0.40
weight_regularity            = 0.25

[e3_triage]
# spec 5.3: transparent weighted sum. Every component is a visible column.
weight_pocket_score          = 0.30
weight_pocket_volume         = 0.10
weight_structural_coverage   = 0.15
weight_expression_selectivity = 0.20
weight_substrate_count       = 0.15
weight_family_novelty        = 0.10
# spec 9.3: the enrichment test must run with these held out of the weights,
# otherwise it is circular.
validation_held_out_fields   = ["exploitation_status", "has_ligand"]
pocket_volume_reference_a3   = 1000.0  # normaliser, not a cutoff
expression_breadth_tissue_tpm = 1.0    # a tissue counts as expressing above this

[degradability.reach_window]
# spec 5.4 step 4: THESE ARE A STARTING POINT FOR THE OPTIMISER ONLY.
# They carry no empirical standing and must not survive into a shipped config
# unless the protein-level-split fit independently lands on them. The fitter
# overwrites this whole table and records the provenance fields below.
fitted                       = false
# "not yet fitted" would now be wrong. The accessibility fit HAS run: it reached
# a held-out AUC of 0.546 and missed the 0.65 floor, so it correctly wrote
# nothing. An eighteen-feature ablation then asked whether exposure was merely
# the wrong feature, and the best within-protein AUC any monomer-derivable set
# reaches is 0.626 (D-054, pipeline/degradability_features.py). So these values
# stay unfitted on evidence rather than on nobody having tried, and no
# degradability verdict is emitted.
fit_status                   = "fitted and rejected: held-out AUC 0.5458 misses the 0.65 floor, and no monomer-derivable feature set clears it (D-054)"
min_nz_rel_sasa              = 0.35
favourable_cb_cb_min_a       = 5.0
favourable_cb_cb_max_a       = 18.0
marginal_cb_cb_max_a         = 24.0
dataset_version              = "digly_sites, retrieved 2026-10-04"
fit_date                     = "2026-10-04"
held_out_auc                 = 0.5458
held_out_auc_floor           = 0.65   # spec 9.4 floor, not a fitted value

[validation]
# spec Section 9 floors. A metric below its floor triggers one documented
# adjustment, then Gate G6.
glue_recall_floor            = 0.85
glue_artefact_precision_floor = 0.95
glue_packing_specificity_floor = 0.90
degron_sensitivity_floor     = 0.70
degron_specificity_floor     = 0.60
e3_enrichment_p_max          = 0.01
e3_substrate_spearman_floor  = 0.50
e3_pocket_coverage_floor     = 0.80
degradability_auc_floor      = 0.65
lm_parse_rate_floor          = 0.99
lm_set_equality_synthetic_floor = 0.90
lm_set_equality_external_floor  = 0.80
lm_triage_macro_f1_floor     = 0.85
lm_corruption_mode_floor     = 0.80
lm_fabrication_rate_max      = 0.00
lm_baseline_skip_finetune_at = 0.85   # spec 3.0: do not fine-tune Task A above this

# Spec 9.2 matched zinc-finger screen. The significance cut is the one Sievers
# et al. use in the paper's own analysis, not a cut chosen here, and the
# residue overlap is how a degron candidate on the AlphaFold model is tied to
# an assayed zinc-finger domain: any shared residue counts, because the screen
# reports a domain window and the scan reports a hairpin inside it.
sievers_fdr                  = 0.05
degron_overlap_residues      = 1

# Spec 9.2's cross-compound transfer test, on the Slabicki validation panel
# (NIHMS2104733 supplement 5): 57 validated degron constructs assayed against
# all 29 glutarimide analogs. The FDR cut and the depletion direction are the
# ones the paper's own analysis uses. A compound needs enough constructs on
# both sides of its label for an AUC to mean anything, hence the floor.
panel_fdr                    = 0.05
panel_min_class_size         = 3      # constructs needed in the smaller class
panel_permutation_draws      = 2000   # shuffles of the sequence score vector
panel_subsample_draws        = 200    # size-matched controls for core-disjointness
panel_seed                   = 20261004

[atlas]
# spec 6.5 budgets.
max_bundle_gb                = 2.5
max_entity_json_kb           = 150
structure_trim_radius_a      = 8.0    # neighbourhood kept around chains of interest
lens_graph_max_nodes         = 400
lens_graph_default_depth     = 2

[e3_triage.families]
# InterPro signatures defining the human E3 repertoire (spec 5.3). Each is
# queried against UniProt for reviewed human proteins and the union is the
# repertoire, cross-checked against UniProt keyword KW-0833 (Ubl conjugation
# pathway). Counts at the 2026-10 release are in FINDINGS.md.
RING      = "IPR001841"
HECT      = "IPR000569"
RBR       = "IPR002867"
F-box     = "IPR001810"
BTB       = "IPR000210"
SOCS-box  = "IPR001496"
U-box     = "IPR003613"
Cullin    = "IPR001373"
APC-C     = "IPR024991"
# CRL4 substrate receptors. Spec 5.3 names "DCAF" among the cullin-RING
# adaptors, and omitting it left CRBN, VHL, DCAF15 and DCAF16 out of the
# repertoire altogether: the exact ligases the project exists to study. These
# signatures were read from each protein's own UniProt InterPro cross-references
# rather than recalled.
CULT      = "IPR034750"   # cereblon family; CRBN carries this and no RING/BTB signature
VHL-box   = "IPR022772"   # von Hippel-Lindau tumour suppressor b/a domain
DCAF15    = "IPR038914"
DCAF16    = "IPR028216"

[e3_triage.name_families]
# Some substrate-receptor families have no single distinguishing InterPro
# signature: a DCAF is a WD40 protein, and WD40 alone would pull in hundreds of
# unrelated proteins. UniProt's own recommended-name annotation is the precise
# rule, so it is used directly.
DCAF = "DDB1- and CUL4-associated factor"

[e3_triage.exploitation]
# Literature-derived status for `exploitation_status` only. Spec 9.3 requires
# this field to be held OUT of the ranking weights, so using a curated list here
# cannot make the enrichment test circular: it is the thing being tested for.
# Gene symbols, not accessions, because that is how the degrader literature names them.
clinically_validated = ["CRBN", "VHL"]
chemically_validated = ["BIRC2", "BIRC3", "XIAP", "MDM2", "DCAF15", "DCAF16",
                        "DCAF11", "KEAP1", "FEM1B", "RNF114", "RNF4", "BTRC",
                        "SKP2", "CDC20", "FBXW7", "DDB1", "CUL4A", "CUL4B"]
covalent_handle_only = ["RNF114", "DCAF16", "DCAF11", "FEM1B", "KEAP1"]
