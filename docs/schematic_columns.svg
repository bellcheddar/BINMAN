<text class="n" x="1042" y="192">build_atlas.py</text>
<text class="n" x="1042" y="214">build_about.py</text>
<text class="n" x="1042" y="236">app/queries.py</text>
<text class="n" x="1042" y="258">app/db.py</text>
<line class="dot" x1="1042" y1="274" x2="1256" y2="274"/>
<text class="ac" x="1042" y="298">Flask, SQLite, nginx,</text>
<text class="ac" x="1042" y="320">gunicorn, certbot</text>
<text class="gd" x="1042" y="392">206 MB SQLite</text>
<text class="s" x="1042" y="414">53 sources credited</text>
<path class="a" d="M1149,446 L1149,502" marker-end="url(#tip)"/>
<rect class="band" x="60" y="510" width="1210" height="140" rx="2"/>
<text class="lane" x="74" y="534">SHARED BY EVERY STAGE</text>
<rect class="card" x="74" y="546" width="222" height="90" rx="2"/>
<text class="hd" x="86" y="570">pixi</text>
<text class="s" x="86" y="594">conda-forge, bioconda</text>
<text class="s" x="86" y="614">and PyPI, Python 3.11.16</text>
<rect class="card" x="310" y="546" width="222" height="90" rx="2"/>
<text class="hd" x="322" y="570">config/</text>
<text class="s" x="322" y="594">tuning.toml: 14 workers</text>
<text class="s" x="322" y="614">thresholds.toml: cutoffs</text>
<rect class="card" x="546" y="546" width="222" height="90" rx="2"/>
<text class="hd" x="558" y="570">data/manifests/</text>
<text class="s" x="558" y="594">one JSONL row per item,</text>
<text class="s" x="558" y="614">so every stage resumes</text>
<rect class="card" x="782" y="546" width="222" height="90" rx="2"/>
<text class="hd" x="794" y="570">pytest</text>
<text class="s" x="794" y="594">117 test functions</text>
<text class="s" x="794" y="614">over 14 files</text>
<rect class="card" x="1018" y="546" width="238" height="90" rx="2"/>
<text class="hd" x="1030" y="570">git, GitHub</text>
<text class="s" x="1030" y="594">BUILD_LOG, PROGRESS and</text>
<text class="s" x="1030" y="614">DECISIONS: 94 entries</text>
<text class="foot" x="60" y="678">Counts read from app/static/about.json as generated 2026-10-16, from the model card and from the repository itself. Library names are parsed from the imports.</text>
</svg>
