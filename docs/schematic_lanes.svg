<text class="hd" x="204" y="626">Every stage appends one row per item to data/manifests/&lt;stage&gt;.jsonl</text>
<text class="sm" x="204" y="644">So a killed run resumes from the manifest, and a failure is a recorded row rather than an absence.</text>
<text class="foot" x="60" y="678">Counts read from app/static/about.json as generated 2026-10-16, from the model card and from the repository itself. Library names are parsed from the imports.</text>
