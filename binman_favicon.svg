<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="BINMAN">
  <title>BINMAN</title>
  <!-- Independent of the blog mark by design (spec 4.5): this is the app's own
       ternary triangle, in the app's own Depot palette (concrete and sodium
       amber), not the blog mark with its wordmark removed.

       Three corners: glue, ligase, target. The centre resolves only when all
       three are pinned, which is exactly what the header glyph does in the
       running app. At 16px it reads as a filled triangle with three dots. -->
  <rect width="64" height="64" rx="10" fill="#E9EAE5"/>
  <path d="M32 13 L53 50 L11 50 Z"
        fill="none" stroke="#15171A" stroke-width="5"
        stroke-linejoin="round"/>
  <circle cx="32" cy="36" r="5.5" fill="#2C6D60"/>
  <circle cx="32" cy="13" r="7.5" fill="#D65B0A" stroke="#15171A" stroke-width="3.5"/>
  <circle cx="11" cy="50" r="7.5" fill="#D65B0A" stroke="#15171A" stroke-width="3.5"/>
  <circle cx="53" cy="50" r="7.5" fill="#D65B0A" stroke="#15171A" stroke-width="3.5"/>
</svg>
