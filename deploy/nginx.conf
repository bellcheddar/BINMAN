# BINMAN nginx site. Copy to /etc/nginx/sites-available/binman.
# certbot --nginx -d binman.mdeller.com adds the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name binman.mdeller.com;

    access_log /var/log/nginx/binman.access.log;
    error_log  /var/log/nginx/binman.error.log;

    # Trimmed mmCIF files are served gzipped and are immutable once built, so
    # they are cached hard and handed straight to Mol* without touching Flask.
    location /api/structures/ {
        alias /srv/binman/app/static/structures/;
        gzip off;                        # the files are already gzip
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { } default_type chemical/x-mmcif;
        try_files $uri =404;
    }

    location /static/ {
        alias /srv/binman/app/static/;
        add_header Cache-Control "public, max-age=604800";
        gzip_static on;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;
}
