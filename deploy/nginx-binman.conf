# nginx site for BINMAN (binman.mdeller.com).
#
# Install to /etc/nginx/sites-available/binman, link into sites-enabled, then
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d binman.mdeller.com
# which rewrites this block with the TLS server and the redirect.

server {
    server_name binman.mdeller.com;

    # Shared access log in the vhost format so the mdeller.com launcher's hit
    # counter sees it: a private log or the default format reads a flat zero.
    access_log /var/log/nginx/access.log vhost;

    client_max_body_size 4m;

    # Vendored front-end: Mol*, D3, Plotly, Tabulator and the self-hosted
    # fonts never change under one URL, because the build pins their versions.
    location /static/vendor/ {
        alias /opt/binman/app/static/vendor/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Trimmed structures are stored gzipped on disk as `.cif.gz`. Flask sets
    # Content-Encoding automatically for a .gz file and nginx does not, so
    # without this the browser is handed raw gzip bytes, Mol* cannot parse them
    # and the viewer fails silently with a clean console. That is the whole
    # difference between local QC passing and the live site showing no
    # structure.
    #
    # With Content-Encoding declared, Content-Type must describe the
    # DECOMPRESSED payload, and gzip must be off here or nginx would compress
    # an already-compressed body a second time.
    location ~* ^/static/structures/(?<cif>.+\.cif\.gz)$ {
        alias /opt/binman/app/static/structures/$cif;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "public, max-age=86400" always;
        default_type chemical/x-mmcif;
        gzip off;
        access_log off;
    }

    location /static/structures/ {
        alias /opt/binman/app/static/structures/;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # The app's own CSS and JS must REVALIDATE, not sit in a browser cache for
    # an hour. They were served at max-age=3600, so every deploy was invisible
    # to anyone who had loaded the page in the previous hour: a CSS fix shipped
    # and the reporter still saw the broken behaviour. "no-cache" does not mean
    # do not store, it means ask first; the ETag still saves the transfer.
    location /static/css/ {
        alias /opt/binman/app/static/css/;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location /static/js/ {
        alias /opt/binman/app/static/js/;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location /static/ {
        alias /opt/binman/app/static/;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The atlas answers most queries in milliseconds, but a cold SQLite
        # page cache on a first large query can take a few seconds.
        proxy_read_timeout 90s;
    }

    listen 80;
}
